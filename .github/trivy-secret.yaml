# Secret rules for the image scan in .github/workflows/container-image.yml.
# Trivy's built-in rules stay enabled; these add key formats the built-ins do
# not cover. Any finding fails the job, whatever its severity.
#
# A regex starts at the beginning of a line or after a character that cannot
# be part of a key, so an identifier that only contains a prefix does not
# match. Libraries that test for a prefix (supabase-js checks for
# "sb_secret_") carry no key after it, so their code does not match either.

rules:
  # Supabase secret API key: sb_secret_, 22 base64url characters, an
  # underscore and an 8-character checksum.
  # https://supabase.com/docs/guides/getting-started/api-keys
  - id: supabase-secret-key
    category: Supabase
    title: Supabase secret API key
    severity: CRITICAL
    regex: "(?:^|[^A-Za-z0-9_])(?P<secret>sb_secret_[A-Za-z0-9_-]{20,})"
    secret-group-name: secret
    keywords:
      - sb_secret_

  # Supabase personal access token, used by the CLI and the Management API.
  - id: supabase-access-token
    category: Supabase
    title: Supabase personal access token
    severity: CRITICAL
    regex: "(?:^|[^A-Za-z0-9_])(?P<secret>sbp_[A-Za-z0-9]{10,})(?:[^A-Za-z0-9_]|$)"
    secret-group-name: secret
    keywords:
      - sbp_

  # Resend API key: re_, 8 characters, an underscore and 24 characters, the
  # shape TruffleHog's Resend detector matches.
  # https://github.com/trufflesecurity/trufflehog/tree/main/pkg/detectors/resend
  - id: resend-api-key
    category: Resend
    title: Resend API key
    severity: CRITICAL
    regex: "(?:^|[^A-Za-z0-9_])(?P<secret>re_[A-Za-z0-9]{8}_[A-Za-z0-9]{24})(?:[^A-Za-z0-9_]|$)"
    secret-group-name: secret
    keywords:
      - re_

  # A PEM private key encoded as base64, as when a key is stored in an
  # environment variable. The prefix encodes "-----BEGIN "; each alternative
  # completes the PRIVATE, RSA, EC or OPENSSH private-key header. They are
  # written apart so that this file holds no complete encoded header, which
  # scripts/verify-no-secrets.mjs would report.
  - id: base64-private-key
    category: AsymmetricPrivateKey
    title: Base64-encoded private key
    severity: CRITICAL
    regex: "LS0tLS1CRUdJTi(?:BQUklWQVRFIEtFWS0tLS0t|BSU0EgUFJJVkFURSBLRVktLS0tLQ|BFQyBQUklWQVRFIEtFWS0tLS0t|BPUEVOU1NIIFBSSVZBVEUgS0VZLS0tLS0)"
    keywords:
      - LS0tLS1CRUdJTi
