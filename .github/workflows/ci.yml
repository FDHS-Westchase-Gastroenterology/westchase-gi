name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
          cache: npm

      # The job's only secret is the Browserbase session key. npm lifecycle
      # code is skipped so dependency postinstall scripts cannot read it; the
      # PR itself therefore still cannot reach deployment credentials.
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify dependency automation policy
        run: node --test .github/scripts/dependency-automation.test.cjs

      - name: Verify destructive E2E target guard
        run: npm run test:e2e-guard

      - name: Portal unit tests
        run: npm run test:unit

      # Oxlint and anti-slop stay in the local config (`npm run lint`).
      # CI does not run them until a dedicated findings PR lands.

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-server-placeholder
          PORTAL_BASE_URL: http://127.0.0.1:3100
        run: npm run build

      - name: Install Cloudflare quick tunnel
        run: |
          curl -sSfL "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" -o cloudflared
          echo "${CLOUDFLARED_SHA256}  cloudflared" | sha256sum -c -
          install -m 0755 cloudflared /usr/local/bin/cloudflared
          cloudflared --version
        env:
          CLOUDFLARED_VERSION: "2026.8.2"
          CLOUDFLARED_SHA256: "fcfb02b575a52ca1af2e3267af4e1517bcdeb30ac48c834c69abaed3c0576ad2"

      - name: Run public smoke on Browserbase
        env:
          E2E_PUBLIC_SMOKE: "1"
          E2E_BROWSER: browserbase
          E2E_TUNNEL: "1"
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
        run: npm run test:e2e:smoke
