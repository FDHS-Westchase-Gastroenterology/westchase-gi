name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
          cache: npm

      # This job intentionally receives no repository secrets. npm lifecycle
      # code and the PR itself therefore cannot reach deployment credentials.
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      # Fails the build if any machine-local path is tracked, and if the
      # .gitignore managed block has drifted from local-only-paths.json.
      # Runs before the heavy steps so a leak fails in seconds, not minutes.
      - name: Verify no machine-local paths are tracked
        run: npm run local-only:check

      - name: Verify .gitignore matches local-only-paths.json
        run: npm run local-only:verify

      - name: Verify dependency automation policy
        run: node --test .github/scripts/dependency-automation.test.cjs

      - name: Verify destructive E2E target guard
        run: npm run test:e2e-guard

      - name: Portal unit tests
        run: npm run test:unit

      # Oxlint and anti-slop stay in the local config (`npm run lint`).
      # CI does not run them until a dedicated findings PR lands.

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-server-placeholder
          PORTAL_BASE_URL: http://127.0.0.1:3100
        run: npm run build

      - name: Install browser for the public specs
        run: npx playwright install --with-deps chromium

      # The patient-site specs that need no credentials: smoke, language
      # Chooser, leak hygiene. Everything that needs a database runs in the
      # Supabase-integration workflow against a Preview Branch.
      - name: Run public browser specs
        run: npm run test:e2e:public
