name: Preview Database Readiness

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  deployments: read
  statuses: read

concurrency:
  group: preview-database-readiness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  readiness:
    # This exact check name is configured as a required PR status after the
    # authorized operator enables the Supabase GitHub + Vercel integrations.
    name: preview-database-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Wait for the exact-head, branch-bound Preview
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_ID: ${{ github.event.pull_request.number }}
        run: |
          last_error="No exact-head Vercel Preview deployment was ready."
          for attempt in $(seq 1 90); do
            deployment_id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/deployments?sha=${HEAD_SHA}&environment=Preview&per_page=100" \
              --jq 'map(select(
                .environment == "Preview" and
                .performed_via_github_app.slug == "vercel"
              )) | max_by(.id).id // empty')"
            if [ -n "$deployment_id" ]; then
              preview_url="$(gh api \
                "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses?per_page=1" \
                --jq '.[0] | select(.state == "success") | (.environment_url // empty)')"
              if [ -n "$preview_url" ]; then
                if node scripts/check-preview-schema-readiness.mjs \
                  --url "$preview_url" \
                  --migrations-dir supabase/migrations \
                  --commit-sha "$HEAD_SHA" \
                  --pull-request-id "$PULL_REQUEST_ID" \
                  2>preview-readiness-error.log; then
                  exit 0
                fi
                last_error="$(cat preview-readiness-error.log)"
              fi
            fi
            sleep 10
          done
          echo "$last_error"
          echo "No branch-bound Vercel Preview became ready for ${HEAD_SHA}."
          exit 1
