name: Supabase Branch Integration

# Supabase creates one hosted Preview Branch for every PR. This workflow waits
# for that branch's migrations/configuration/seed deployment, fetches only its
# ephemeral credentials, and runs the destructive portal contract there.
on:
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize]
  # The dependency controller dispatches after token-authored branch refreshes,
  # which GitHub deliberately does not emit as a pull_request event.
  workflow_dispatch:

permissions:
  checks: read
  contents: read
  deployments: read

concurrency:
  group: supabase-branch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: supabase-integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Must match the origin Playwright drives (baseURL http://localhost:3100):
      # Next dev serves its client chunks only to origins it knows, so a setup
      # Link on 127.0.0.1 opens a page that never hydrates.
      PORTAL_BASE_URL: http://localhost:3100
      PORTAL_SEED_ADMIN_EMAIL: ${{ secrets.PORTAL_PREVIEW_ADMIN_EMAIL }}
      PORTAL_SEED_ADMIN_PASSWORD: ${{ secrets.PORTAL_PREVIEW_ADMIN_PASSWORD }}
      SUPABASE_PARENT_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - name: Wait for the Supabase Preview deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          for attempt in {1..90}; do
            check="$(
              gh api "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" \
                --jq '[.check_runs[]
                  | select(.name == "Supabase Preview" and .app.slug == "supabase")]
                  | sort_by(.id) | last // {}'
            )"
            status="$(jq -r '.status // "missing"' <<<"$check")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$check")"
            echo "Supabase Preview: status=$status conclusion=${conclusion:-pending}"

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                break
              fi
              echo "Supabase Preview did not succeed."
              exit 1
            fi
            if [ "$attempt" = 90 ]; then
              echo "Supabase Preview did not complete within 15 minutes."
              exit 1
            fi
            sleep 10
          done

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.113.0

      - name: Load the matching Preview Branch credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PARENT_PROJECT_REF"
          test -n "$BRANCH_NAME"

          branch_env="$RUNNER_TEMP/supabase-branch.env"
          supabase branches get "$BRANCH_NAME" \
            --project-ref "$SUPABASE_PARENT_PROJECT_REF" \
            --output env > "$branch_env"

          set -a
          . "$branch_env"
          set +a
          rm -f "$branch_env"

          branch_ref="${SUPABASE_URL#https://}"
          branch_ref="${branch_ref%.supabase.co}"
          if ! [[ "$branch_ref" =~ ^[a-z0-9]{20}$ ]] ||
            [ "$branch_ref" = "$SUPABASE_PARENT_PROJECT_REF" ]; then
            echo "Refusing a missing, malformed, or Production branch reference."
            exit 1
          fi

          public_key="${SUPABASE_PUBLISHABLE_KEY:-${SUPABASE_ANON_KEY:-}}"
          service_key="${SUPABASE_SERVICE_ROLE_KEY:-${SUPABASE_SECRET_KEY:-}}"
          test -n "$public_key"
          test -n "$service_key"
          test -n "$POSTGRES_URL_NON_POOLING"

          for value in \
            "$public_key" \
            "$service_key" \
            "$POSTGRES_URL" \
            "$POSTGRES_URL_NON_POOLING"; do
            echo "::add-mask::$value"
          done

          {
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$public_key"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$service_key"
            printf 'POSTGRES_URL=%s\n' "$POSTGRES_URL"
            printf 'POSTGRES_URL_NON_POOLING=%s\n' "$POSTGRES_URL_NON_POOLING"
            printf 'SUPABASE_BRANCH_PROJECT_REF=%s\n' "$branch_ref"
            printf 'SUPABASE_PROJECT_REF=%s\n' "$branch_ref"
            printf 'PLAYWRIGHT_ALLOWED_SUPABASE_PROJECT_REF=%s\n' "$branch_ref"
            printf 'SUPABASE_PROJECT_REF_PROD=%s\n' "$SUPABASE_PARENT_PROJECT_REF"
            printf 'SUPABASE_URL_PROD=https://%s.supabase.co\n' \
              "$SUPABASE_PARENT_PROJECT_REF"
            printf 'SUPABASE_PREVIEW_BRANCH=1\n'
          } >> "$GITHUB_ENV"

      - name: Verify Vercel uses the matching Preview Branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          for attempt in {1..90}; do
            deployment_id="$(
              gh api "repos/$REPOSITORY/deployments?sha=$HEAD_SHA&per_page=100" \
                --jq '[.[]
                  | select(.environment == "Preview" and .creator.login == "vercel[bot]")]
                  | sort_by(.id) | last | .id // empty'
            )"

            if [ -n "$deployment_id" ]; then
              deployment_status="$(
                gh api "repos/$REPOSITORY/deployments/$deployment_id/statuses?per_page=100" \
                  --jq 'sort_by(.id) | last // {}'
              )"
              state="$(jq -r '.state // "pending"' <<<"$deployment_status")"
              preview_url="$(jq -r '.environment_url // .target_url // empty' \
                <<<"$deployment_status")"
              echo "Vercel Preview: state=$state"

              if [ "$state" = "success" ] && [ -n "$preview_url" ]; then
                attestation="$(curl --fail --silent --show-error \
                  "$preview_url/api/preview-environment")"
                jq -e \
                  --arg branch_ref "$SUPABASE_BRANCH_PROJECT_REF" \
                  --arg head_sha "$HEAD_SHA" \
                  '.ok == true
                    and .schemaCompatible == true
                    and .clientKeySafe == true
                    and .projectRef == $branch_ref
                    and .gitCommitSha == $head_sha' \
                  <<<"$attestation" >/dev/null
                printf 'Verified Vercel Preview %s uses Supabase branch %s.\n' \
                  "$preview_url" "$SUPABASE_BRANCH_PROJECT_REF"
                break
              fi

              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
                echo "Vercel Preview did not succeed."
                exit 1
              fi
            else
              echo "Vercel Preview: deployment pending"
            fi

            if [ "$attempt" = 90 ]; then
              echo "Vercel Preview did not become verifiably branch-matched within 15 minutes."
              exit 1
            fi
            sleep 10
          done

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Seed Preview Branch Auth and portal fixtures
        run: node scripts/seed-portal.mjs --target branch

      - name: Verify Preview Branch schema, RLS, RPCs, and seed
        run: node scripts/verify-schema.mjs --target branch

      # Trust boundaries first (Auth refresh, SSR sessions, closed Data API and
      # RLS, intake throttling, field caps, lifecycle, RPC persistence), then
      # The staff-portal journeys. Both folders need the Preview Branch.
      - name: Verify Supabase trust boundaries
        run: npm run test:e2e:boundaries

      - name: Run staff-portal browser specs
        run: npm run test:e2e:portal
