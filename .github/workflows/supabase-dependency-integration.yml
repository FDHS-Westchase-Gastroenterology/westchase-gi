name: Supabase Dependency Integration

# Runs on every PR so the `supabase-integration` gate check always reports.
# A cheap detection job decides from the actual diff whether the disposable
# Supabase stack is needed; the gate passes trivially when it is not. This
# replaces the old hand-enumerated `on.pull_request.paths` list, whose failure
# mode was a silently absent check when a new database-adjacent file was not
# added to the list.
on:
  pull_request:
    branches: ["main"]
  # The dependency controller uses this after a GITHUB_TOKEN-authored branch
  # refresh, which GitHub deliberately does not emit as a pull_request event.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-dependency-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect-database-surface
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Detect database-adjacent changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Manual dispatch always runs the integration suite."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet --depth=1 origin "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA" HEAD)"
          printf 'Changed files:\n%s\n' "$changed"
          relevant=false
          while IFS= read -r file; do
            case "$file" in
              package.json|package-lock.json) relevant=true ;;
              .github/workflows/supabase-dependency-integration.yml) relevant=true ;;
              supabase/*|scripts/*|e2e/*) relevant=true ;;
              src/lib/portal/*|src/app/admin/*|src/app/api/*) relevant=true ;;
              "src/app/[locale]/appointment/"*) relevant=true ;;
            esac
          done <<< "$changed"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  integration:
    name: supabase-integration-test
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PORTAL_BASE_URL: http://127.0.0.1:3100
      PORTAL_SEED_ADMIN_EMAIL: admin@local.westchase.test
      PORTAL_SEED_ADMIN_PASSWORD: Local-Dependabot-Only-2026!
      PLAYWRIGHT_ALLOWED_SUPABASE_PROJECT_REF: local
      SUPABASE_PROJECT_REF: local
      SUPABASE_PROJECT_REF_PROD: production-ref
      SUPABASE_URL_PROD: https://production-ref.supabase.co
      VERCEL_ENV: preview
      VERCEL_GIT_COMMIT_SHA: disposable-preview-sha
      VERCEL_GIT_PULL_REQUEST_ID: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
          cache: npm

      # Install hooks run before local credentials exist. The test job receives
      # no repository secrets, deployment credentials, or persisted Git token.
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify portal query parsing
        run: node --test src/lib/portal/request-query.test.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install pinned Supabase CLI
        id: supabase_cli
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.111.0

      - name: Start disposable local Supabase
        env:
          OPENAI_API_KEY: local-studio-disabled
        run: |
          docker network create \
            -o com.docker.network.bridge.host_binding_ipv4=127.0.0.1 \
            supabase-dependency
          supabase start \
            --network-id supabase-dependency \
            --exclude studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta \
            --yes
          eval "$(
            supabase status -o env \
              --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
              --override-name auth.publishable_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
              --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY
          )"
          {
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$NEXT_PUBLIC_SUPABASE_URL"
            printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' \
              "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Seed disposable portal fixtures
        run: node scripts/seed-portal.mjs --target local

      - name: Verify Supabase client, SSR Auth, RLS, and PostgREST
        run: >-
          npx playwright test
          e2e/supabase-dependency-contract.spec.ts
          e2e/intake-api.spec.ts
          e2e/portal-auth.spec.ts
          e2e/portal-lifecycle.spec.ts
          e2e/preview-schema-readiness.spec.ts
          e2e/portal-requests.spec.ts
          e2e/portal-scale.spec.ts
          --project=chromium

      - name: Stop disposable local Supabase
        if: always() && steps.supabase_cli.outcome == 'success'
        run: supabase stop --no-backup --yes

  # Always-reporting gate. This job carries the `supabase-integration` check
  # name that the dependency controller (.github/scripts/dependency-automation.cjs)
  # and branch protection consume: success when the integration suite passed or
  # was legitimately skipped, failure otherwise.
  gate:
    name: supabase-integration
    needs: [changes, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the integration result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          echo "changes=$CHANGES_RESULT integration=$INTEGRATION_RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change detection did not succeed."
            exit 1
          fi
          case "$INTEGRATION_RESULT" in
            success)
              echo "Integration suite passed." ;;
            skipped)
              echo "No database-adjacent changes; integration suite not required." ;;
            *)
              echo "Integration suite did not succeed."
              exit 1 ;;
          esac
