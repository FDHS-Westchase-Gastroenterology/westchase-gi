name: Supabase Branch Integration

# A pull request into main owns a hosted Preview Branch that Supabase creates
# for it. A pull request into an integration branch inherits that branch's
# database. This workflow resolves which database the head belongs to, checks
# that its applied migrations match the code, and runs the destructive portal
# contract there, one run per database at a time.
on:
  pull_request:
    types: [opened, reopened, synchronize]
  # The dependency controller dispatches after token-authored branch refreshes,
  # which GitHub deliberately does not emit as a pull_request event.
  workflow_dispatch:

permissions:
  checks: read
  contents: read
  deployments: read
  pull-requests: read

concurrency:
  group: supabase-branch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: database owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      branch: ${{ steps.owner.outputs.branch }}
      role: ${{ steps.owner.outputs.role }}
    steps:
      - name: Resolve the database-owning branch
        id: owner
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          repo_owner="${REPOSITORY%%/*}"
          open_base() {
            gh api "repos/$REPOSITORY/pulls?state=open&head=$repo_owner:$1&per_page=1" \
              --jq '.[0].base.ref // empty'
          }

          base="$BASE_BRANCH"
          if [ -z "$base" ]; then
            base="$(open_base "$HEAD_BRANCH")"
          fi

          # Walk the open pull-request chain until a branch merges into main;
          # that branch owns the Preview database.
          owner="$HEAD_BRANCH"
          hops=0
          while [ -n "$base" ] && [ "$base" != "main" ]; do
            hops=$((hops + 1))
            if [ "$hops" -gt 5 ]; then
              echo "::error::No branch merging into main within five hops of $HEAD_BRANCH."
              exit 1
            fi
            owner="$base"
            base="$(open_base "$owner")"
            if [ -z "$base" ]; then
              echo "::error::$owner has no open pull request, so its database owner is unknown."
              exit 1
            fi
          done

          if [ "$owner" = "$HEAD_BRANCH" ]; then role=owner; else role=inherited; fi
          printf 'branch=%s\nrole=%s\n' "$owner" "$role" >> "$GITHUB_OUTPUT"
          printf 'Database owner: `%s` (%s)\n' "$owner" "$role" >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: supabase-integration
    needs: database
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Branches that share a database never run the destructive specs at once.
    # GitHub keeps one waiting run per group; a third arrival cancels the
    # waiting one, which then needs a re-run.
    concurrency:
      group: supabase-database-${{ needs.database.outputs.branch }}
      cancel-in-progress: false
    env:
      DB_BRANCH: ${{ needs.database.outputs.branch }}
      DB_ROLE: ${{ needs.database.outputs.role }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      # Must match the origin Playwright drives (baseURL http://localhost:3100):
      # Next dev serves its client chunks only to origins it knows, so a setup
      # Link on 127.0.0.1 opens a page that never hydrates.
      PORTAL_BASE_URL: http://localhost:3100
      PORTAL_SEED_ADMIN_EMAIL: ${{ secrets.PORTAL_PREVIEW_ADMIN_EMAIL }}
      PORTAL_SEED_ADMIN_PASSWORD: ${{ secrets.PORTAL_PREVIEW_ADMIN_PASSWORD }}
      SUPABASE_PARENT_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      # Only a database this head owns is deployed from it. The migration
      # lineage step below decides whether that deployment left the schema
      # matching the code, so the Preview conclusion is reported, not gated.
      - name: Wait for the Supabase Preview deployment
        if: env.DB_ROLE == 'owner'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          for attempt in {1..90}; do
            check="$(
              gh api "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" \
                --jq '[.check_runs[]
                  | select(.name == "Supabase Preview" and .app.slug == "supabase")]
                  | sort_by(.id) | last // {}'
            )"
            status="$(jq -r '.status // "missing"' <<<"$check")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$check")"
            echo "Supabase Preview: status=$status conclusion=${conclusion:-pending}"

            if [ "$status" = "completed" ]; then
              printf 'PREVIEW_CONCLUSION=%s\n' "$conclusion" >> "$GITHUB_ENV"
              break
            fi
            if [ "$attempt" = 90 ]; then
              echo "::error::Supabase Preview did not complete on $HEAD_SHA within 15 minutes."
              exit 1
            fi
            sleep 10
          done

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.113.0

      - name: Load the matching Preview Branch credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PARENT_PROJECT_REF"
          test -n "$DB_BRANCH"

          branch_env="$RUNNER_TEMP/supabase-branch.env"
          supabase branches get "$DB_BRANCH" \
            --project-ref "$SUPABASE_PARENT_PROJECT_REF" \
            --output env > "$branch_env"

          set -a
          . "$branch_env"
          set +a
          rm -f "$branch_env"

          branch_ref="${SUPABASE_URL#https://}"
          branch_ref="${branch_ref%.supabase.co}"
          if ! [[ "$branch_ref" =~ ^[a-z0-9]{20}$ ]] ||
            [ "$branch_ref" = "$SUPABASE_PARENT_PROJECT_REF" ]; then
            echo "Refusing a missing, malformed, or Production branch reference."
            exit 1
          fi

          public_key="${SUPABASE_PUBLISHABLE_KEY:-${SUPABASE_ANON_KEY:-}}"
          service_key="${SUPABASE_SERVICE_ROLE_KEY:-${SUPABASE_SECRET_KEY:-}}"
          test -n "$public_key"
          test -n "$service_key"
          test -n "$POSTGRES_URL_NON_POOLING"

          for value in \
            "$public_key" \
            "$service_key" \
            "$POSTGRES_URL" \
            "$POSTGRES_URL_NON_POOLING"; do
            echo "::add-mask::$value"
          done

          {
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$public_key"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$service_key"
            printf 'POSTGRES_URL=%s\n' "$POSTGRES_URL"
            printf 'POSTGRES_URL_NON_POOLING=%s\n' "$POSTGRES_URL_NON_POOLING"
            printf 'SUPABASE_BRANCH_PROJECT_REF=%s\n' "$branch_ref"
            printf 'SUPABASE_PROJECT_REF=%s\n' "$branch_ref"
            printf 'PLAYWRIGHT_ALLOWED_SUPABASE_PROJECT_REF=%s\n' "$branch_ref"
            printf 'SUPABASE_PROJECT_REF_PROD=%s\n' "$SUPABASE_PARENT_PROJECT_REF"
            printf 'SUPABASE_URL_PROD=https://%s.supabase.co\n' \
              "$SUPABASE_PARENT_PROJECT_REF"
            printf 'SUPABASE_PREVIEW_BRANCH=1\n'
          } >> "$GITHUB_ENV"

      # The specs below drive a local server on the loaded credentials, so a
      # mismatched Vercel Preview cannot change what they test. It is fatal
      # for the database owner and reported for a branch that inherits.
      - name: Verify Vercel uses the matching Preview Branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          fail() {
            if [ "$DB_ROLE" = "owner" ]; then
              echo "::error::$1"
              exit 1
            fi
            echo "::warning::$1"
            exit 0
          }

          for attempt in {1..90}; do
            deployment_id="$(
              gh api "repos/$REPOSITORY/deployments?sha=$HEAD_SHA&per_page=100" \
                --jq '[.[]
                  | select(.environment == "Preview" and .creator.login == "vercel[bot]")]
                  | sort_by(.id) | last | .id // empty'
            )"

            if [ -n "$deployment_id" ]; then
              deployment_status="$(
                gh api "repos/$REPOSITORY/deployments/$deployment_id/statuses?per_page=100" \
                  --jq 'sort_by(.id) | last // {}'
              )"
              state="$(jq -r '.state // "pending"' <<<"$deployment_status")"
              preview_url="$(jq -r '.environment_url // .target_url // empty' \
                <<<"$deployment_status")"
              echo "Vercel Preview: state=$state"

              if [ "$state" = "success" ] && [ -n "$preview_url" ]; then
                attestation="$(curl --fail --silent --show-error \
                  "$preview_url/api/preview-environment")" ||
                  fail "Vercel Preview $preview_url did not answer its attestation."
                jq -e \
                  --arg branch_ref "$SUPABASE_BRANCH_PROJECT_REF" \
                  --arg head_sha "$HEAD_SHA" \
                  '.ok == true
                    and .schemaCompatible == true
                    and .clientKeySafe == true
                    and .projectRef == $branch_ref
                    and .gitCommitSha == $head_sha' \
                  <<<"$attestation" >/dev/null ||
                  fail "Vercel Preview $preview_url does not attest Supabase branch $SUPABASE_BRANCH_PROJECT_REF at $HEAD_SHA."
                printf 'Verified Vercel Preview %s uses Supabase branch %s.\n' \
                  "$preview_url" "$SUPABASE_BRANCH_PROJECT_REF"
                break
              fi

              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
                fail "Vercel Preview did not succeed."
              fi
            else
              echo "Vercel Preview: deployment pending"
            fi

            if [ "$attempt" = 90 ]; then
              fail "Vercel Preview did not become verifiably branch-matched within 15 minutes."
            fi
            sleep 10
          done

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify the database's migration lineage
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: node scripts/verify-migration-lineage.mjs

      - name: Seed Preview Branch Auth and portal fixtures
        run: node scripts/seed-portal.mjs --target branch

      - name: Verify Preview Branch schema, RLS, RPCs, and seed
        run: node scripts/verify-schema.mjs --target branch

      # Trust boundaries first (Auth refresh, SSR sessions, closed Data API and
      # RLS, intake throttling, field caps, lifecycle, RPC persistence), then
      # The staff-portal journeys. Both folders need the Preview Branch.
      - name: Verify Supabase trust boundaries
        run: npm run test:e2e:boundaries

      - name: Run staff-portal browser specs
        run: npm run test:e2e:portal
